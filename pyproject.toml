[project]
name = "annotation-tools"
dynamic = ["version"]
description = "Provides tools for function inspection and translating annotations."
readme = "README.md"
authors = [
    { name = "Vizonex", email = "VizonexBusiness@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.16.0; python_version < '3.15'",
]

[tool.setuptools.dynamic]
version = {attr = "annotation_tools.__version__"}

[build-system]
requires = ["setuptools"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff.lint]
select = [
  "I",
  "PLC0415",
  "UP",
]
